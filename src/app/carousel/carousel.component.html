<div class="mb-2 relative w-full overflow-hidden bg-emerald-50">
  <!-- Slides -->
  <div
    class="flex transition-transform duration-500 py-8 md:py-20"
    [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
  >
    <div *ngFor="let slide of slides" class="w-full flex-shrink-0">
      <div
        class="bg-white shadow-md rounded-lg p-6 h-full w-75 sm:w-3/4 md:w-3xl mx-auto flex flex-col"
      >
        <img
          [src]="slide"
          alt="Product"
          class="w-full rounded-md mb-4 h-40 object-cover"
        />
        <h4 class="text-xl font-semibold text-gray-800">Mens Cotton Jacket</h4>

        <div class="mt-auto">
          <p class="text-green-600 font-bold">$55.99</p>
          <button
            class="bg-blue-500 text-white px-4 py-2 rounded-lg mt-4 hover:bg-blue-600"
          >
            Add to Cart
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Previous Button -->
  <button
    (click)="prevSlide()"
    class="absolute mx-0 sm:mx-2 hidden sm:block cursor-pointer left-0 top-1/2 transform -translate-y-1/2 bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      class="w-6 h-6"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        d="M15 19l-7-7 7-7"
      />
    </svg>
  </button>

  <!-- Next Button -->
  <button
    (click)="nextSlide()"
    class="absolute mx-0 sm:mx-2 hidden sm:block cursor-pointer right-0 top-1/2 transform -translate-y-1/2 bg-cyan-600 hover:bg-cyan-700 text-white px-4 py-2"
  >
    <svg
      xmlns="http://www.w3.org/2000/svg"
      fill="none"
      viewBox="0 0 24 24"
      stroke-width="2"
      stroke="currentColor"
      class="w-6 h-6"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7" />
    </svg>
  </button>

  <!-- Navigation Indicators -->
  <div
    class="absolute bottom-2 left-1/2 transform -translate-x-1/2 flex space-x-2 mb-0"
  >
    <button
      *ngFor="let slide of slides; index as i"
      (click)="goToSlide(i)"
      [class]="{ 'bg-orange-600': i === currentIndex }"
      class="cursor-pointer w-3 h-3 rounded-full bg-gray-400"
    ></button>
  </div>
</div>
