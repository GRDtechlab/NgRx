<nav
  class="bg-gray-100 border-b-amber-950 shadow-md sticky top-0 w-full z-50 dark:bg-gray-900 dark:border-gray-700"
>
  <div class="max-w-screen-xl flex items-center justify-between mx-auto p-4">
    <!-- Branding Section -->
    <h1
      class="text-3xl font-extrabold cursor-pointer hover:text-blue-600 dark:hover:text-blue-400"
      routerLink="/"
    >
      Ngrx Store
    </h1>

    <!-- desktop center menus goes here.. must be responsive when screen size <=768 -->

    <div class="hidden md:flex gap-6">
      <a
        routerLink="/"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Home
      </a>
      <a
        routerLink="/product-list"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Products
      </a>
      <a
        routerLink="/about"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        About
      </a>
      <a
        routerLink="/contact"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Contact
      </a>
    </div>

    <!-- Desktop Navigation Links -->
    <div class="hidden md:flex items-center gap-6">
      <!-- Cart Link -->
      <div
        class="relative px-2.5 flex items-center cursor-pointer text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
        routerLink="/cart"
      >
        <!-- Cart Icon -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-8 w-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3h2l.341 1.366a3 3 0 003 2.634h8.655a3 3 0 003-2.634L19 3h2"
          />
          <circle cx="9" cy="20" r="2" />
          <circle cx="15" cy="20" r="2" />
        </svg>

        <!-- Badge -->
        <span
          class="absolute top-0 right-0 bg-orange-600 text-white text-xs font-bold px-2 py-1 rounded-lg whitespace-nowrap"
        >
          {{ cart() }}
        </span>
      </div>

      <!-- Auth Section -->
      <app-auth></app-auth>
    </div>

    <!-- Hamburger Menu for Mobile -->
    <button
      class="md:hidden cursor-pointer text-gray-800 dark:text-gray-300 hover:text-blue-600 dark:hover:text-blue-400 focus:outline-none"
      (click)="toggleMenu()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M4 6h16M4 12h16M4 18h16"
        />
      </svg>
    </button>
  </div>

  <!-- Mobile Navigation Menu -->
  <div
    class="md:hidden space-y-2 p-4 bg-gray-100 dark:bg-gray-900"
    [ngClass]="{
      'flex justify-between': isMenuOpen,
      hidden: !isMenuOpen
    }"
  >
    <!-- Center Menus (Mobile) -->
    <div class="flex flex-col gap-2">
      <a
        routerLink="/"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Home
      </a>
      <a
        routerLink="/product-list"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Products
      </a>
      <a
        routerLink="/about"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        About
      </a>
      <a
        routerLink="/contact"
        class="text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
      >
        Contact
      </a>
    </div>
    <div class="relative">
      <div
        class="mb-3 cursor-pointer text-gray-800 hover:text-blue-600 dark:text-gray-300 dark:hover:text-blue-400"
        routerLink="/cart"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M3 3h2l.341 1.366a3 3 0 003 2.634h8.655a3 3 0 003-2.634L19 3h2"
          />
          <circle cx="9" cy="20" r="2" />
          <circle cx="15" cy="20" r="2" />
        </svg>
        <!-- Badge -->
        <span
          class="absolute -top-3 left-5 bg-orange-600 text-white text-xs font-bold px-2 py-1 rounded-lg whitespace-nowrap"
        >
          {{ cart() }}
        </span>
      </div>
      <app-auth></app-auth>
    </div>
  </div>
</nav>
