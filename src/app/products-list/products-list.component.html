<div class="flex flex-row min-h-screen bg-gray-100">
  <!-- Filter Component -->
  <app-filter />
  <div class="container mx-auto p-5">
    <h1 class="text-2xl font-bold text-center mb-5">Product List</h1>
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
      @for(product of products(); track product.id){
      <app-product [product]="product" (addToCartEvent)="addToCart($event)" />
      }@empty {
      <p class="font-bold text-xl text-blue-500">Product is being loading...</p>
      }
    </div>
  </div>
</div>
